<path d="M532,196 L532,204 L637,204 L637,196" stroke="#3b6fb6" stroke-width="1.5" fill="none"/>
<path d="M637,196 L637,204 L740,204 L740,196" stroke="#c77a10" stroke-width="1.5" fill="none"/>
<text x="585" y="222" text-anchor="middle" class="s">position</text>
<text x="688" y="222" text-anchor="middle" class="s">color</text>
<text x="635" y="258" text-anchor="middle" class="s">one vertex = stride = 24 B (interleaved)</text>

<text x="20" y="300" class="s">Format (what an attribute looks like) is stored per attribute; source (buffer, offset, stride) per binding point.</text>
